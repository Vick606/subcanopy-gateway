services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: scg
      POSTGRES_PASSWORD: scg
      POSTGRES_DB: scg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scg -d scg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: