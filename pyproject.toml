[project]
name = "subcanopy-gateway"
version = "0.1.0"
description = "HTTP gateway for Subcanopy Guard. Scan prompts and tool outputs for injection attempts, store scan history, search known attack patterns."
readme = "README.md"
authors = [
    { name = "Victor", email = "vickoch20@gmail.com" }
]
requires-python = ">=3.14.7"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "subcanopy-guard>=0.3.1",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.0",
    "sentence-transformers>=6.1.0",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/versions/**" = ["E501", "F401", "I001", "UP007", "UP035", "W291"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app", "tests"]
reportUnnecessaryTypeIgnoreComment = true
