[project]
name = "subcanopy-gateway"
version = "0.1.0"
description = "HTTP gateway for Subcanopy Guard. Scan prompts and tool outputs for injection attempts, store scan history, search known attack patterns."
readme = "README.md"
authors = [
    { name = "Victor", email = "vickoch20@gmail.com" }
]
requires-python = ">=3.14.7"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "subcanopy-guard>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app", "tests"]
reportUnnecessaryTypeIgnoreComment = true
